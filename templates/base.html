<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca Pessoal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>📚 Biblioteca Pessoal</h1>
    <nav>
      <a href="{{ url_for('listar_livros') }}">Livros</a>
      <a href="{{ url_for('gerenciar_categorias') }}">Categorias</a>
    </nav>
  </header>

  <main>
    {% for tipo, msg in get_flashed_messages(with_categories=true) %}
      <div class="alerta {{ tipo }}">{{ msg }}</div>
    {% endfor %}

    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
